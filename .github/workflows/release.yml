name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Generate Isar schema code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization code
        run: flutter gen-l10n

      - name: Generate platform folders
        run: flutter create . --platforms=android,ios --org com.ememzyvisuals --project-name ekklesia

      - name: Write google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Configure Android release signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
          python3 - <<'PYEOF'
          import re, os
          path = "android/app/build.gradle"
          if not os.path.exists(path) and os.path.exists(path + ".kts"):
              path = path + ".kts"
          src = open(path).read()
          if "keystoreProperties" not in src:
              inject = '''
          def keystorePropertiesFile = rootProject.file("key.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              src = src.replace("android {", inject + "\nandroid {", 1)
              release_signing = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
          '''
              src = re.sub(r"buildTypes \{", release_signing + "\n    buildTypes {", src, count=1)
              src = src.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )
              open(path, "w").write(src)
              print(f"Patched {path} with release signing config.")
          else:
              print(f"{path} already references keystoreProperties — skipping patch.")
          PYEOF

      - name: Apply Google Services Gradle plugin
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: |
          python3 - <<'PYEOF'
          import os

          root_path = "android/build.gradle"
          if not os.path.exists(root_path) and os.path.exists(root_path + ".kts"):
              root_path = root_path + ".kts"
          root_src = open(root_path).read()
          if "google-services" not in root_src:
              root_src = root_src.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
              open(root_path, "w").write(root_src)
              print(f"Added google-services classpath to {root_path}.")
          else:
              print(f"{root_path} already references google-services — skipping.")

          app_path = "android/app/build.gradle"
          if not os.path.exists(app_path) and os.path.exists(app_path + ".kts"):
              app_path = app_path + ".kts"
          app_src = open(app_path).read()
          plugin_line = (
              'apply(plugin = "com.google.gms.google-services")'
              if app_path.endswith(".kts")
              else "apply plugin: 'com.google.gms.google-services'"
          )
          if "google-services" not in app_src:
              open(app_path, "a").write(f"\n{plugin_line}\n")
              print(f"Applied google-services plugin in {app_path}.")
          else:
              print(f"{app_path} already applies google-services — skipping.")
          PYEOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build App Bundle (for Play Store)
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  create-release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flutter-apk/app-release.apk
            dist/bundle/release/app-release.aab
          generate_release_notes: true
          draft: true

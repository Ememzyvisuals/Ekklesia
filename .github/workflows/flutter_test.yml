name: Flutter Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # See flutter_ci.yml's identical step for why this is required —
      # test/features/bible/*_test.dart import types from generated files
      # (Isar schemas, and transitively AppLocalizations elsewhere in the
      # app) that don't exist until these run.
      - name: Generate Isar schema code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization code
        run: flutter gen-l10n

      - name: Run tests
        run: flutter test --coverage --reporter expanded

      # Real tests now exist (test/features/bible/*, test/l10n/*) — see
      # test/README.md for exact scope. Still partial (no Isar-runtime,
      # widget, or Cloud Functions tests yet), but this step is no longer
      # a "passes trivially with zero tests" placeholder.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

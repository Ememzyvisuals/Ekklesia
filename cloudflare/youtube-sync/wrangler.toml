name = "ekklesia-youtube-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Same cadence as the Cloud Function version (youtubeSyncSchedule).
crons = ["*/15 * * * *"]

[vars]
# Not secrets — Firebase project IDs are public (already in every
# client's google-services.json). Replace with your real project ID.
FIREBASE_PROJECT_ID = "your-firebase-project-id"

# These ARE secrets — never put them here. Set with:
#   wrangler secret put YOUTUBE_API_KEY
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
